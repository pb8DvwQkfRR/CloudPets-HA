[project]
name = "cloudpets-ha"
version = "0.1.0"
description = "CloudPets Home Assistant integration"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant==2026.10.4",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-homeassistant-custom-component>=0.13.375",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
